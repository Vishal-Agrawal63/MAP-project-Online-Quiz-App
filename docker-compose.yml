# docker-compose.yml

# as no longer needed in new version
# version: '3.8'

services:
  # Backend Service (Node.js API)
  backend:
    build: ./backend # Path to the backend directory containing its Dockerfile
    container_name: quiz-backend
    restart: unless-stopped
    volumes:
      # Mount the local 'data' directory into the container
      # This ensures data persistence for users.json and leaderboard.json
      - ./backend/data:/app/data
    # Environment variables (optional, can be useful)
    # environment:
    #   - NODE_ENV=production
    expose:
      - '3001' # Expose port only to linked services (frontend via Nginx proxy)
    # ports:
    #  - '3001:3001' # Optional: Uncomment to access backend API directly from host on port 3001 for debugging

  # Frontend Service (React App served by Nginx)
  frontend:
    build: ./frontend # Path to the frontend directory containing its Dockerfile
    container_name: quiz-frontend-nginx
    restart: unless-stopped
    ports:
      # Map port 8080 on the host to port 80 in the container (where Nginx listens)
      - '8080:80'
    depends_on:
      - backend # Ensures backend starts first (networking dependency)

# Optional: Define named volumes if preferred over bind mounts
# volumes:
#   quiz_data:
# (Then use 'quiz_data:/app/data' in backend volumes)