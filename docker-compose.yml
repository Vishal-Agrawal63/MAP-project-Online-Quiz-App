# docker-compose.yml

# version: '3.8' # No longer needed

services:
  # Backend Service (Node.js API)
  backend:
    build: ./backend
    container_name: quiz-backend
    restart: unless-stopped
    # Remove volume mount for /app/data if data is now in Mongo
    # volumes:
    #   - ./backend/data:/app/data
    environment:
      # Pass the MongoDB URI for the containerized mongo service
      # 'mongo' is the service name below. 'quizAppDb' is the database name.
      - MONGODB_URI=mongodb://mongo:27017/quizAppDb
      - OPENROUTER_API_KEY=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
      # Add other env vars like NODE_ENV=production
    expose:
      - '3001'
    depends_on:
      - mongo # Ensure mongo starts before the backend

  # Frontend Service (React App served by Nginx)
  frontend:
    build: ./frontend
    container_name: quiz-frontend-nginx
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - backend

  # MongoDB Service
  mongo:
    image: mongo:latest # Use an official Mongo image
    container_name: quiz-mongo-db
    restart: unless-stopped
    ports:
      # Optional: Expose Mongo port to host for Compass access (e.g., 27017:27017)
      # Be careful with exposing DB ports in production environments
       - '27017:27017'
    volumes:
      # Persist MongoDB data using a named volume
      - mongo_data:/data/db
    # Optional: Set root username/password if needed for authentication
    # environment:
    #   - MONGO_INITDB_ROOT_USERNAME=admin
    #   - MONGO_INITDB_ROOT_PASSWORD=secret

# Define the named volume for MongoDB data persistence
volumes:
  mongo_data: