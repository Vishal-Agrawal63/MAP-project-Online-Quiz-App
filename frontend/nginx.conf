# frontend/nginx.conf

server {
    listen 80;
    server_name localhost; # Or your domain name

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # Handle SPA routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    # '/api/' requests will be forwarded to the 'backend' service defined in docker-compose.yml
    location /api/ {
        # The backend service name and port from docker-compose.yml
        proxy_pass http://backend:3001;

        # Necessary headers for proxying
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: Add error pages, gzip compression etc. here
    # location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
    #   expires 1M;
    #   access_log off;
    #   add_header Cache-Control "public";
    # }
    # location ~* \.(?:css|js)$ {
    #   expires 1y;
    #   access_log off;
    #   add_header Cache-Control "public";
    # }
}